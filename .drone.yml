kind: pipeline
type: docker
name: default

steps:
  - name: install dependencies
    image: oven/bun:latest
    commands:
      - bun install

  - name: build docker image
    image: docker
    commands:
      - docker build -t my-web-app:${DRONE_BUILD_NUMBER} .

  - name: push docker image
    image: docker
    environment:
      DATABASE_URL: "postgres://admin:jfm85TuiO7VFkjNB@192.168.10.10:5432/postgres"
      GOOGLE_CLIENT_ID:
        from_secret: GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET:
        from_secret: GOOGLE_CLIENT_SECRET
      GOOGLE_REDIRECT_URL:
        from_secret: GOOGLE_REDIRECT_URL
      GITHUB_CLIENT_ID:
        from_secret: GITHUB_CLIENT_ID
      GITHUB_CLIENT_SECRET:
        from_secret: GITHUB_CLIENT_SECRET
      GITHUB_REDIRECT_URL:
      from_secret: GITHUB_REDIRECT_URL
      PRIVATE_KEY_FILE: 
        from_secret: PRIVATE_KEY_FILE
      PUBLIC_KEY_FILE:
        from_secret: PUBLIC_KEY_FILE
      ALLOWED_HOST:
        from_secret: ALLOWED_HOST
    commands:
      - docker push my-web-app:${DRONE_BUILD_NUMBER}