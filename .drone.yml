kind: pipeline
type: docker
name: default

steps:
  - name: install dependencies
    image: oven/bun:latest
    commands:
      - bun install

  - name: build and run
    image: docker
    environment:
      ENV_FILE:
        from_secret: ENV_FILE   # Drone secret berisi .env string
    commands:
      # Simpan .env dari secret
      - echo "$ENV_FILE" > .env

      # Build image
      - docker build -t my-web-app:${DRONE_BUILD_NUMBER} .

      # Stop container lama jika ada
      - docker stop my-web-app || true
      - docker rm my-web-app || true

      # Run container baru pakai env-file
      - docker run -d \
          --name my-web-app \
          --env-file .env \
          -p 8000:3000 \
          my-web-app:${DRONE_BUILD_NUMBER}
