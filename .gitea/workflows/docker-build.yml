name: Build docker app

on:
  push:
    branches:
      - main
    

jobs:
  build:
    runs-on: debian-custom
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
      - name: Checkout code
        run: |
          git init
          git remote add origin $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git
          git fetch --depth=1 origin $GITHUB_SHA
          git checkout FETCH_HEAD
        
      - name: install dependencies
        run: |
          bun install

      - name: Build docker
        run: |
          echo "$ENV_FILE" > .env
          docker build -t portofolio-api:latest .
      
      - name: Export docker image
        run: |
          mkdir -p /opt/myapps
          docker save portofolio-api:latest -o /opt/myapps/portofolio-api.tar 