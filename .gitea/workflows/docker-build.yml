name: Build docker app

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: debian-custom
    steps:
      - name: Checkout code
        run: |
          git init
          git remote add origin $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git
          git fetch --depth=1 origin $GITHUB_SHA
          git checkout FETCH_HEAD

      - name: Build docker
        run: |
          IMAGE_NAME="${GITEA_REPO_NAME}:${GITEA_WORKFLOW_SHA}"
          echo "Building image $IMAGE_NAME..."
          docker build -t $IMAGE_NAME .

      - name: Export docker image
        run: |
          IMAGE_NAME="${GITEA_REPO_NAME}:${GITEA_WORKFLOW_SHA}"
          DEST_DIR="/opt/myapps/${GITEA_REPO_NAME}"
          echo "Creating folder $DEST_DIR..."
          mkdir -p $DEST_DIR
          echo "Saving image $IMAGE_NAME to $DEST_DIR/$IMAGE_NAME.tar..."
          docker save $IMAGE_NAME -o $DEST_DIR/$IMAGE_NAME.tar

      - name: Notify
        run: |
          IMAGE_NAME="${GITEA_REPO_NAME}:${GITEA_WORKFLOW_SHA}"
          DEST_DIR="/opt/myapps/${GITEA_REPO_NAME}"
          echo "Saved successfully: $DEST_DIR/$IMAGE_NAME.tar"
